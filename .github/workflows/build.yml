name: Build Monicon TrollStore TIPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundled iOS libraries and app icon
        run: |
          test -f Thirdparties/libs/ios/libuvc.a
          test -f Thirdparties/libs/ios/libusb-1.0.a
          test -f Thirdparties/libs/ios/libjpeg.a
          test -f Monicon/Assets.xcassets/AppIcon.appiconset/Monicon-1024.png

      - name: Build iPadOS 16 app
        run: |
          xcodebuild \
            -project Monicon.xcodeproj \
            -scheme Monicon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate app bundle and package TIPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Monicon.app"
          test -d "$APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -f "$APP/$EXECUTABLE"
          test -f "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "Monicon"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.0.0"
          file "$APP/$EXECUTABLE" | grep -E "Mach-O|executable"
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/Monicon.app"
          codesign --force --deep --sign - --entitlements Monicon/MoniconUSB.entitlements "build/Payload/Monicon.app"
          cd build
          /usr/bin/zip -qry -y Monicon-1.0.0.tipa Payload
          unzip -l Monicon-1.0.0.tipa | grep -E "Payload/Monicon.app/Monicon$|Payload/Monicon.app/Info.plist$|Payload/Monicon.app/Assets.car$"
          printf '%s\n' "1. Download the GitHub Actions artifact ZIP." "2. Unzip that outer ZIP once." "3. Install the inner Monicon-1.0.0.tipa file with TrollStore." "4. This app installs beside UVC Diagnostic because it has a separate bundle ID." > TIPA-INSTALL.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Monicon-1.0.0-tipa
          path: |
            build/Monicon-1.0.0.tipa
            build/TIPA-INSTALL.txt
